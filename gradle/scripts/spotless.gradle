// Spotless auto-formatter
// See https://github.com/diffplug/spotless/tree/main/plugin-gradle
// Can be locally toggled via spotless:off/spotless:on comments
spotless {
    encoding 'UTF-8'

    format 'misc', {
        target '.gitignore'

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        def orderFile = file("$rootDir/gradle/spotless/spotless.importorder")
        def formatFile = file("$rootDir/gradle/spotless/spotless.eclipseformat.xml")

        toggleOffOn()
        importOrderFile(orderFile)
        removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
        trimTrailingWhitespace()
        leadingSpacesToTabs()
        endWithNewline()
        eclipse('4.31').configFile(formatFile)
    }
    kotlin {
        target 'src/main/java/**/*.kt', 'src/test/java/**/*.kt'

        def orderFile = file("$rootDir/gradle/spotless/spotless.ktlint")
        ktlint()
            .setEditorConfigPath(orderFile)
            .editorConfigOverride([
                'max_line_length': '200',
                'ktlint_standard_no-unused-imports': 'enabled',
                'ktlint_standard_package-name': 'disabled',
            ])

        toggleOffOn()
        replaceRegex(
            'empty Kotlin function bodies',
            /(?m)(fun[^\n{=]*\([^)]*\)(?:\s*:\s*[^\n{=]+)?\s*)\{\r?\n[ \t]*\}/,
            '$1{}'
        )
        trimTrailingWhitespace()
        leadingSpacesToTabs()
        endWithNewline()
    }
    json {
        target('src/*/resources/**/*.json', 'src/*/resources/**/*.mcmeta')
        targetExclude 'src/generated/resources/**'
        biome()
        trimTrailingWhitespace()
        leadingSpacesToTabs()
        endWithNewline()
    }
}
