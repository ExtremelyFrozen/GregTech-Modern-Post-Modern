                'src/main/resources/assets/gtpm/ui/recipe_type/lathe.xml',
                'src/main/resources/assets/gtpm/ui/recipe_type/research_station.xml'
        ]
        var missingFiles = migratedSurfacePaths.findAll { !file(it).isFile() }
        if (!missingFiles.isEmpty()) {
            throw new GradleException("LDLib2 migrated surface files are missing: ${missingFiles.join(', ')}")
        }

        var transitionalLegacyLinesBySurface = [:]
        var transitionalLegacyTypesBySurface = [:]

        var patterns = [
                'com.lowdragmc.lowdraglib.',
                'IngredientIO.RENDER_ONLY',
                'IngredientIO.valueOf("RENDER_ONLY")',
                'IngredientIO.BOTH',
                'setXEIRecipeSlot',
                '@RPCMethod',
                'RPCEmitter',
                'RPCEventBuilder',
                'PacketUIRPCEvent',
                'PacketUIRPCEventReturn',
                'setOnServerClick',
                'addRPCEvent(',
                'addServerEventListener(',
                'getBuffer().createUI(',
                '.markAsDirty(',
                'com.lowdragmc.lowdraglib2.syncdata.',
                'com.lowdragmc.lowdraglib2.gui.sync.',
                '.rtui',
                '<ldlib-ui',
                'ldlib:',
                'Objects.requireNonNull',
                'requireNonNull('
        ]

        var matches = []
        migratedSurfacePaths.each { surfacePath ->
            var scannedFile = file(surfacePath)
            var relativePath = rootProject.relativePath(scannedFile)
            var remainingAllowedLegacyLines = [:]
            (transitionalLegacyLinesBySurface[surfacePath] ?: []).each { allowedLine ->
                remainingAllowedLegacyLines[allowedLine] =
                        (remainingAllowedLegacyLines.containsKey(allowedLine) ?
                                remainingAllowedLegacyLines[allowedLine] : 0) + 1
            }
            scannedFile.eachLine('UTF-8') { line, number ->
                var reasons = patterns.findAll { pattern -> line.contains(pattern) }
                var transitionalLegacyType = transitionalLegacyTypesBySurface[surfacePath]
                if (transitionalLegacyType != null && transitionalLegacyType.matcher(line).find()) {
                    reasons.add('transitional legacy UI type')
                }
                if (!reasons.isEmpty()) {
                    var trimmedLine = line.trim()
                    var remaining = remainingAllowedLegacyLines.containsKey(trimmedLine) ?
                            remainingAllowedLegacyLines[trimmedLine] : 0
                    if (remaining > 0) {
                        remainingAllowedLegacyLines[trimmedLine] = remaining - 1
                    } else {
                        reasons.each { reason -> matches.add("${relativePath}:${number}: ${reason}") }
                    }
                }
            }
            remainingAllowedLegacyLines.findAll { line, remaining -> remaining > 0 }.each { line, remaining ->
                matches.add("${relativePath}: missing ${remaining} transitional legacy baseline occurrence: ${line}")
            }
        }

        if (!matches.isEmpty()) {
            logger.lifecycle('LDLib2 migrated surface guardrail matches:')
            matches.take(200).each { logger.lifecycle(" - ${it}") }
            if (matches.size() > 200) {
                logger.lifecycle(" - ... ${matches.size() - 200} more")
            }
            throw new GradleException("LDLib2 migrated surface guardrails found ${matches.size()} regression references.")
        }
    }
}

