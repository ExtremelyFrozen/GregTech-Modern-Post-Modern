tasks.register('verifyGradleUserHomeOnE') {
    group = 'verification'
    description = 'Verifies Gradle user home is configured on the E: drive.'

    doLast {
        var gradleUserHome = gradle.gradleUserHomeDir.toPath().toAbsolutePath().normalize().toString()
        if (!gradleUserHome.replace('\\', '/').startsWith('E:/')) {
            throw new GradleException("Gradle user home must be on E: drive, but was: ${gradleUserHome}")
        }
    }
}

tasks.register('verifyLdlib2MigratedSurfaces') {
    group = 'verification'
    description = 'Verifies migrated LDLib2 UI bridge and facade surfaces do not regress to legacy LDLib or disabled sync paths.'

    doLast {
        var migratedSurfacePaths = [
                'src/main/java/com/gregtechceu/gtceu/api/block/MetaMachineBlock.java',
                'src/main/java/com/gregtechceu/gtceu/api/gui/factory/LDLib2MachineUIProvider.java',
                'src/main/java/com/gregtechceu/gtceu/api/gui/factory/MachineUIHelper.java',
                'src/main/java/com/gregtechceu/gtceu/api/gui/factory/MachineUIHolder.java',
                'src/main/java/com/gregtechceu/gtceu/api/gui/factory/MachineUIHolderContext.java',
                'src/main/java/com/gregtechceu/gtceu/api/machine/steam/SimpleSteamMachine.java',
                'src/main/java/com/gregtechceu/gtceu/api/machine/steam/SteamBoilerMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/electric/PumpMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/DataAccessHatchMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/MaintenanceHatchPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/MufflerPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/ObjectHolderMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/ParallelHatchPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/PumpHatchPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/RotorHolderPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/SteamHatchPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/part/SteamItemBusPartMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/primitive/CokeOvenMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/primitive/PrimitiveBlastFurnaceMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/steam/LargeBoilerMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/multiblock/steam/SteamParallelMultiblockMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/steam/SteamMinerMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/storage/CrateMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/storage/CreativeComputationProviderMachine.java',
                'src/main/java/com/gregtechceu/gtceu/common/machine/storage/CreativeEnergyContainerMachine.java'
        ]
        var missingFiles = migratedSurfacePaths.findAll { !file(it).isFile() }
        if (!missingFiles.isEmpty()) {
            throw new GradleException("LDLib2 migrated surface files are missing: ${missingFiles.join(', ')}")
        }

        var patterns = [
                'com.lowdragmc.lowdraglib.',
                '@RPCMethod',
                'RPCEmitter',
                'RPCEventBuilder',
                'PacketUIRPCEvent',
                'PacketUIRPCEventReturn',
                'setOnServerClick',
                'com.lowdragmc.lowdraglib2.syncdata.',
                'com.lowdragmc.lowdraglib2.gui.sync.',
                'Objects.requireNonNull',
                'requireNonNull(',
                'java.util.Objects'
        ]

        var matches = []
        migratedSurfacePaths.each { surfacePath ->
            var scannedFile = file(surfacePath)
            var relativePath = rootProject.relativePath(scannedFile)
            scannedFile.eachLine('UTF-8') { line, number ->
                patterns.each { pattern ->
                    if (line.contains(pattern)) {
                        matches.add("${relativePath}:${number}: ${pattern}")
                    }
                }
            }
        }

        if (!matches.isEmpty()) {
            logger.lifecycle('LDLib2 migrated surface guardrail matches:')
            matches.take(200).each { logger.lifecycle(" - ${it}") }
            if (matches.size() > 200) {
                logger.lifecycle(" - ... ${matches.size() - 200} more")
            }
            throw new GradleException("LDLib2 migrated surface guardrails found ${matches.size()} regression references.")
        }
    }
}

tasks.named('check') {
    dependsOn(
            tasks.named('verifyGradleUserHomeOnE'),
            tasks.named('verifyLdlib2MigratedSurfaces')
    )
}

tasks.register('verifyLdlib2MigrationGuardrails') {
    group = 'verification'
    description = 'Reports remaining legacy LDLib references that must be removed before migration completion.'

    doLast {
        var sourceRoots = [
                file('src/main/java'),
                file('src/test/java'),
                file('src/main/resources'),
                file('src/main/templates')
        ]
        var sourceFilesToScan = files(sourceRoots.findAll { it.exists() }).asFileTree.matching {
            include '**/*.java'
            include '**/*.kt'
            include '**/*.json'
            include '**/*.toml'
            include '**/*.mcmeta'
            include '**/*.md'
            include '**/*.rtui'
            include '**/*.xml'
            exclude 'src/generated/**'
        }
        var gradleFilesToScan = files([
                file('dependencies.gradle'),
                file('gradle/forge.versions.toml'),
                file('gradle/scripts/resources.gradle')
        ].findAll { it.exists() })
        var filesToScan = sourceFilesToScan + gradleFilesToScan
        var ownImplementationSuffixDeclaration = ~/.*\b(class|interface|enum|record)\s+[A-Za-z0-9_]+Impl\b.*/
        var ldlib2RpcCall = ~/.*\baddRPCEvent\s*\(.*/
        var manualMarkAsDirtyCall = ~/.*\.markAsDirty\s*\(.*/
        var ldlib2FluidClickAttribute = ~/.*(?<!legacy-)allow-click-(filled|drained)=.*/
        var reiCompatibilityReference = ~/.*\b(REI|rei)\b.*/
        var forbiddenNullCheck = 'require' + 'NonNull'
        var legacyFluidXeiSlotEntry = 'setXEIRecipe' + 'Slot'

        var patterns = [
                'com.lowdragmc.lowdraglib.',
                'LDLib2.isEmiLoaded(',
                'IngredientIO.RENDER_ONLY',
                'IngredientIO.valueOf("RENDER_ONLY")',
                'IngredientIO.BOTH',
                'Objects.' + forbiddenNullCheck,
                forbiddenNullCheck + '(',
                legacyFluidXeiSlotEntry,
                '@RPCMethod',
                'RPCEmitter',
                'RPCEventBuilder',
                'PacketUIRPCEvent',
                'PacketUIRPCEventReturn',
                'setOnServerClick',
                'com.lowdragmc.lowdraglib2.integration.xei.rei',
                'ModularUIDisplay',
                'ModularUIDisplayCategory',
                'RoughlyEnoughItems',
                'REIPlugin',
                'isREILoaded',
                'com.lowdragmc.lowdraglib2.syncdata.',
                'com.lowdragmc.lowdraglib2.gui.sync.',
                'compileOnly(forge.ldlib)',
                'api(forge.ldlib)',
                'jarJar(api(forge.ldlib))',
                'jarJar(api(forge.ldlib.get()))',
                'forge.versions.ldlib.get()',
                'version.ref = "ldlib"',
                'com.lowdragmc.ldlib:ldlib-neoforge',
                'ldlib_version',
                'modId = "ldlib"',
                'modrinth = "ldlib"',
                'curseforge = "ldlib"',
                '"ldlib":',
                '"ldlib.',
                'ldlib:'
        ]

        var matches = []
        filesToScan.each { scannedFile ->
            var relativePath = rootProject.relativePath(scannedFile)
            if (relativePath.endsWith('.rtui')) {
                matches.add("${relativePath}: legacy LDLib1 .rtui file")
            } else {
                if (relativePath.endsWith('Impl.java')) {
                    matches.add("${relativePath}: GTM source type must not use Impl suffix")
                }
                var gtmJavaSource = relativePath.startsWith('src/main/java/com/gregtechceu/') ||
                        relativePath.startsWith('src/test/java/com/gregtechceu/')
                scannedFile.eachLine('UTF-8') { line, number ->
                    patterns.each { pattern ->
                        if (line.contains(pattern)) {
                            matches.add("${relativePath}:${number}: ${pattern}")
                        }
                    }
                    if (gtmJavaSource && ownImplementationSuffixDeclaration.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: GTM source type must not use Impl suffix")
                    }
                    if (ldlib2RpcCall.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: LDLib2 RPC must not be used for GTM business UI actions")
                    }
                    if (manualMarkAsDirtyCall.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: Manual markAsDirty calls must not be used for GTM sync")
                    }
                    if (ldlib2FluidClickAttribute.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: LDLib2 fluid click attributes must stay legacy metadata")
                    }
                    if (reiCompatibilityReference.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: REI compatibility is not part of the LDLib2 migration")
                    }
                }
            }
        }

        if (!matches.isEmpty()) {
            logger.lifecycle('Remaining LDLib migration guardrail matches:')
            matches.take(200).each { logger.lifecycle(" - ${it}") }
            if (matches.size() > 200) {
                logger.lifecycle(" - ... ${matches.size() - 200} more")
            }
            throw new GradleException("LDLib2 migration guardrails found ${matches.size()} remaining legacy references.")
        }
    }
}
