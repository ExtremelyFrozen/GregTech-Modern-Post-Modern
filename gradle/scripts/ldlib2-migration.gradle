tasks.register('verifyGradleUserHomeOnE') {
    group = 'verification'
    description = 'Verifies Gradle user home is configured on the E: drive.'

    doLast {
        var gradleUserHome = gradle.gradleUserHomeDir.toPath().toAbsolutePath().normalize().toString()
        if (!gradleUserHome.replace('\\', '/').startsWith('E:/')) {
            throw new GradleException("Gradle user home must be on E: drive, but was: ${gradleUserHome}")
        }
    }
}

tasks.register('verifyDescriptiveTypeNames') {
    group = 'verification'
    description = 'Rejects GTM source types and files that contain generic implementation name segments.'

    doLast {
        var sourceRoots = [
                file('src/main/java'),
                file('src/main/kotlin'),
                file('src/test/java'),
                file('src/test/kotlin')
        ]
        var sourceFiles = files(sourceRoots.findAll { it.exists() }).asFileTree.matching {
            include '**/*.java'
            include '**/*.kt'
            exclude 'src/generated/**'
        }
        var typeDeclaration = ~/(?m)^[\t ]*(?:(?:public|protected|private|abstract|static|final|strictfp|sealed|non-sealed|data|value|internal|open|expect|actual|fun|companion|inner|inline)\s+|@[A-Za-z_$][A-Za-z0-9_$.]*(?:\([^\r\n]*\))?\s+)*(?:@interface|enum\s+class|annotation\s+class|class|interface|record|enum|object|typealias)\s+(?:([A-Za-z_$][A-Za-z0-9_$]*)|`([^`\r\n]+)`)(?=\s|[<(:={]|$)/
        var genericNameSegment = ~/(Implementation|Impl)(?=$|[A-Z0-9_$])/
        var matches = []

        sourceFiles.each { sourceFile ->
            var relativePath = rootProject.relativePath(sourceFile)
            var fileStem = sourceFile.name.substring(0, sourceFile.name.lastIndexOf('.'))
            if (genericNameSegment.matcher(fileStem).find()) {
                matches.add("${relativePath}: generic implementation file name segment")
            }
            var sourceText = sourceFile.getText('UTF-8')
            var declarationMatcher = typeDeclaration.matcher(sourceText)
            while (declarationMatcher.find()) {
                var typeNameGroup = declarationMatcher.group(1) == null ? 2 : 1
                var typeName = declarationMatcher.group(typeNameGroup)
                if (genericNameSegment.matcher(typeName).find()) {
                    var lineNumber = sourceText.substring(0, declarationMatcher.start(typeNameGroup)).count('\n') + 1
                    matches.add("${relativePath}:${lineNumber}: generic implementation type name segment (${typeName})")
                }
            }
        }

        if (!matches.isEmpty()) {
            logger.lifecycle('Generic implementation names found in GTM source:')
            matches.each { logger.lifecycle(" - ${it}") }
            throw new GradleException("GTM source types must be named for their concrete responsibility.")
        }
    }
}

