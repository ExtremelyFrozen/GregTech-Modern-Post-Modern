tasks.register('verifyLdlib2MigrationGuardrails') {
    group = 'verification'
    description = 'Reports remaining legacy LDLib references that must be removed before migration completion.'

    doLast {
        var sourceRoots = [
                file('src/main/java'),
                file('src/test/java'),
                file('src/main/resources'),
                file('src/main/templates')
        ]
        var sourceFilesToScan = files(sourceRoots.findAll { it.exists() }).asFileTree.matching {
            include '**/*.java'
            include '**/*.kt'
            include '**/*.json'
            include '**/*.toml'
            include '**/*.mcmeta'
            include '**/*.md'
            include '**/*.rtui'
            include '**/*.xml'
            exclude 'src/generated/**'
        }
        var gradleFilesToScan = files([
                file('dependencies.gradle'),
                file('gradle/forge.versions.toml'),
                file('gradle/scripts/resources.gradle')
        ].findAll { it.exists() })
        var filesToScan = sourceFilesToScan + gradleFilesToScan
        var ldlib2RpcCall = ~/.*\baddRPCEvent\s*\(.*/
        var manualMarkAsDirtyCall = ~/.*\.markAsDirty\s*\(.*/
        var ldlib2FluidClickAttribute = ~/.*(?<!legacy-)allow-click-(filled|drained)=.*/
        var reiCompatibilityReference = ~/.*\b(REI|rei)\b.*/
        var forbiddenNullCheck = 'require' + 'NonNull'
        var legacyFluidXeiSlotEntry = 'setXEIRecipe' + 'Slot'

        var patterns = [
                'com.lowdragmc.lowdraglib.',
                'LDLib2.isEmiLoaded(',
                'IngredientIO.RENDER_ONLY',
                'IngredientIO.valueOf("RENDER_ONLY")',
                'IngredientIO.BOTH',
                'Objects.' + forbiddenNullCheck,
                forbiddenNullCheck + '(',
                legacyFluidXeiSlotEntry,
                '@RPCMethod',
                'RPCEmitter',
                'RPCEventBuilder',
                'PacketUIRPCEvent',
                'PacketUIRPCEventReturn',
                'setOnServerClick',
                'com.lowdragmc.lowdraglib2.integration.xei.rei',
                'ModularUIDisplay',
                'ModularUIDisplayCategory',
                'RoughlyEnoughItems',
                'REIPlugin',
                'isREILoaded',
                'com.lowdragmc.lowdraglib2.syncdata.',
                'com.lowdragmc.lowdraglib2.gui.sync.',
                'compileOnly(forge.ldlib)',
                'api(forge.ldlib)',
                'jarJar(api(forge.ldlib))',
                'jarJar(api(forge.ldlib.get()))',
                'forge.versions.ldlib.get()',
                'version.ref = "ldlib"',
                'com.lowdragmc.ldlib:ldlib-neoforge',
                'ldlib_version',
                'modId = "ldlib"',
                '"ldlib":',
                '"ldlib.',
                'ldlib:'
        ]

        var matches = []
        filesToScan.each { scannedFile ->
            var relativePath = rootProject.relativePath(scannedFile)
            if (relativePath.endsWith('.rtui')) {
                matches.add("${relativePath}: legacy LDLib1 .rtui file")
            } else {
                scannedFile.eachLine('UTF-8') { line, number ->
                    patterns.each { pattern ->
                        if (line.contains(pattern)) {
                            matches.add("${relativePath}:${number}: ${pattern}")
                        }
                    }
                    if (ldlib2RpcCall.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: LDLib2 RPC must not be used for GTM business UI actions")
                    }
                    if (manualMarkAsDirtyCall.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: Manual markAsDirty calls must not be used for GTM sync")
                    }
                    if (ldlib2FluidClickAttribute.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: LDLib2 fluid click attributes must stay legacy metadata")
                    }
                    if (reiCompatibilityReference.matcher(line).matches()) {
                        matches.add("${relativePath}:${number}: REI compatibility is not part of the LDLib2 migration")
                    }
                }
            }
        }

        if (!matches.isEmpty()) {
            logger.lifecycle('Remaining LDLib migration guardrail matches:')
            matches.take(200).each { logger.lifecycle(" - ${it}") }
            if (matches.size() > 200) {
                logger.lifecycle(" - ... ${matches.size() - 200} more")
            }
            throw new GradleException("LDLib2 migration guardrails found ${matches.size()} remaining legacy references.")
        }
    }
}

tasks.register('reportLdlib2MigrationInventory') {
    group = 'verification'
    description = 'Generates the LDLib2 migration baseline inventory without failing on remaining matches.'

    doLast {
        var sourceRoots = [
                file('src/main/java'),
                file('src/test/java'),
                file('src/main/resources'),
                file('src/main/templates')
        ]
        var sourceFilesToScan = files(sourceRoots.findAll { it.exists() }).asFileTree.matching {
            include '**/*.java'
            include '**/*.kt'
            include '**/*.json'
            include '**/*.toml'
            include '**/*.mcmeta'
            include '**/*.md'
            include '**/*.rtui'
            include '**/*.xml'
            exclude 'src/generated/**'
        }
        var gradleFilesToScan = files([
                file('dependencies.gradle'),
                file('gradle/forge.versions.toml'),
                file('gradle/scripts/resources.gradle')
        ].findAll { it.exists() })
        var filesToScan = (sourceFilesToScan + gradleFilesToScan).files.sort { left, right ->
            rootProject.relativePath(left) <=> rootProject.relativePath(right)
        }
        var legacyFluidXeiSlotEntry = 'setXEIRecipe' + 'Slot'
        var legacyModularUIReference = 'com.lowdragmc.lowdraglib.gui.modular.ModularUI'
        var legacyModularUIWildcard = 'com.lowdragmc.lowdraglib.gui.modular.*'
        var ldlib2ModularUIReferences = [
                'com.lowdragmc.lowdraglib2.gui.ui.ModularUI',
                'com.lowdragmc.lowdraglib2.integration.xei.emi.ModularUIEMIRecipe',
                'com.lowdragmc.lowdraglib2.integration.xei.jei.ModularUIRecipeCategory'
        ]
        var standaloneModularUI = ~/(?<![A-Za-z0-9_$])ModularUI(?![A-Za-z0-9_$])/
        var createModularUI = ~/(?<![A-Za-z0-9_$])createModularUI(?![A-Za-z0-9_$])/

        var stringPatterns = [
                [category: 'legacy-package', snippet: 'com.lowdragmc.lowdraglib.'],
                [category: 'legacy-ui-model', snippet: 'WidgetGroup'],
                [category: 'legacy-ui-model', snippet: 'Widget'],
                [category: 'legacy-xei-role', snippet: 'IngredientIO.RENDER_ONLY'],
                [category: 'legacy-xei-role', snippet: 'IngredientIO.valueOf("RENDER_ONLY")'],
                [category: 'legacy-xei-role', snippet: 'IngredientIO.BOTH'],
                [category: 'legacy-xei-role', snippet: legacyFluidXeiSlotEntry],
                [category: 'legacy-resource', snippet: '"ldlib":'],
                [category: 'legacy-resource', snippet: '"ldlib.'],
                [category: 'legacy-resource', snippet: 'ldlib:'],
                [category: 'disabled-ldlib2-sync', snippet: '@RPCMethod'],
                [category: 'disabled-ldlib2-sync', snippet: 'RPCEmitter'],
                [category: 'disabled-ldlib2-sync', snippet: 'RPCEventBuilder'],
                [category: 'disabled-ldlib2-sync', snippet: 'PacketUIRPCEvent'],
                [category: 'disabled-ldlib2-sync', snippet: 'PacketUIRPCEventReturn'],
                [category: 'disabled-ldlib2-sync', snippet: 'setOnServerClick'],
                [category: 'disabled-ldlib2-sync', snippet: 'com.lowdragmc.lowdraglib2.syncdata.'],
                [category: 'disabled-ldlib2-sync', snippet: 'com.lowdragmc.lowdraglib2.gui.sync.'],
                [category: 'legacy-dependency', snippet: 'compileOnly(forge.ldlib)'],
                [category: 'legacy-dependency', snippet: 'api(forge.ldlib)'],
                [category: 'legacy-dependency', snippet: 'jarJar(api(forge.ldlib))'],
                [category: 'legacy-dependency', snippet: 'jarJar(api(forge.ldlib.get()))'],
                [category: 'legacy-dependency', snippet: 'forge.versions.ldlib.get()'],
                [category: 'legacy-dependency', snippet: 'version.ref = "ldlib"'],
                [category: 'legacy-dependency', snippet: 'com.lowdragmc.ldlib:ldlib-neoforge'],
                [category: 'legacy-dependency', snippet: 'ldlib_version'],
                [category: 'legacy-dependency', snippet: 'modId = "ldlib"']
        ]
        var regexPatterns = [
                [category: 'legacy-ui-model', pattern: ~/.*\bgetModularUIContainer\b.*/,
                 snippet: 'getModularUIContainer'],
                [category: 'legacy-ui-model', pattern: ~/.*\bgetModularUIGui\b.*/, snippet: 'getModularUIGui'],
                [category: 'disabled-ldlib2-sync', pattern: ~/.*\baddRPCEvent\s*\(.*/, snippet: 'addRPCEvent('],
                [category: 'disabled-ldlib2-sync', pattern: ~/.*\.markAsDirty\s*\(.*/, snippet: '.markAsDirty(']
        ]

        var matches = []
        filesToScan.each { scannedFile ->
            var relativePath = rootProject.relativePath(scannedFile)
            if (relativePath.endsWith('.rtui')) {
                matches.add([path: relativePath, line: 1, category: 'legacy-rtui', snippet: 'legacy LDLib1 .rtui file'])
            } else {
                var fileContent = scannedFile.getText('UTF-8')
                var hasLegacyModularUI = fileContent.contains(legacyModularUIReference) ||
                        fileContent.contains(legacyModularUIWildcard)
                var hasLdlib2ModularUI = ldlib2ModularUIReferences.any { fileContent.contains(it) }
                scannedFile.eachLine('UTF-8') { line, number ->
                    stringPatterns.each { inventoryPattern ->
                        if (line.contains(inventoryPattern.snippet)) {
                            matches.add([
                                    path    : relativePath,
                                    line    : number,
                                    category: inventoryPattern.category,
                                    snippet : inventoryPattern.snippet
                            ])
                        }
                    }
                    regexPatterns.each { inventoryPattern ->
                        if (inventoryPattern.pattern.matcher(line).matches()) {
                            matches.add([
                                    path    : relativePath,
                                    line    : number,
                                    category: inventoryPattern.category,
                                    snippet : inventoryPattern.snippet
                            ])
                        }
                    }
                    var referencesModularUI = standaloneModularUI.matcher(line).find()
                    var callsCreateModularUI = createModularUI.matcher(line).find()
                    if (referencesModularUI && hasLegacyModularUI) {
                        matches.add([
                                path    : relativePath,
                                line    : number,
                                category: 'legacy-ui-model',
                                snippet : 'ModularUI'
                        ])
                    } else if (callsCreateModularUI && hasLegacyModularUI && !hasLdlib2ModularUI) {
                        matches.add([
                                path    : relativePath,
                                line    : number,
                                category: 'legacy-ui-model',
                                snippet : 'createModularUI'
                        ])
                    } else if ((referencesModularUI || callsCreateModularUI) &&
                            !hasLegacyModularUI && !hasLdlib2ModularUI) {
                        matches.add([
                                path    : relativePath,
                                line    : number,
                                category: 'unresolved-modular-ui-origin',
                                snippet : referencesModularUI ? 'ModularUI' : 'createModularUI'
                        ])
                    } else if (callsCreateModularUI && hasLegacyModularUI && hasLdlib2ModularUI) {
                        matches.add([
                                path    : relativePath,
                                line    : number,
                                category: 'unresolved-modular-ui-origin',
                                snippet : 'createModularUI'
                        ])
                    }
                }
            }
        }
        matches = matches.sort { left, right ->
            var pathComparison = left.path <=> right.path
            if (pathComparison != 0) {
                return pathComparison
            }
            var lineComparison = left.line <=> right.line
            if (lineComparison != 0) {
                return lineComparison
            }
            var categoryComparison = left.category <=> right.category
            if (categoryComparison != 0) {
                return categoryComparison
            }
            left.snippet <=> right.snippet
        }

        var reportFile = layout.buildDirectory.file('reports/ldlib2-migration/inventory.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter('UTF-8') { writer ->
            writer.writeLine('# LDLib2 migration inventory')
            writer.writeLine('# Format: relative-path:line: category: matching-snippet')
            writer.writeLine("# Matches: ${matches.size()}")
            writer.writeLine('')
            matches.each { match ->
                writer.writeLine("${match.path}:${match.line}: ${match.category}: ${match.snippet}")
            }
        }

        logger.lifecycle("LDLib2 migration inventory written to ${reportFile.absolutePath} with ${matches.size()} matches.")
    }
}
